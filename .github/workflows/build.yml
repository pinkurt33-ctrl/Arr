name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Auto-fix file locations
        run: |
          A=github/workflows/app/src/main
          mkdir -p $A/assets $A/java/com/pinku/webanimator
          echo "=== MainActivity files found in repo ==="
          find . -iname "MainActivity*" -not -path "*/build/*" -not -path "./.git/*" || true
          echo "=== animator files found in repo ==="
          find . -iname "animator*" -not -path "*/build/*" -not -path "./.git/*" || true
          if [ ! -f $A/assets/animator.js ]; then
            F=$(find . -name "animator.js" -not -path "*/build/*" -not -path "./.git/*" | head -n1)
            if [ -n "$F" ]; then cp "$F" $A/assets/animator.js; echo "Copied animator.js from $F"; fi
          fi
          if [ ! -f $A/java/com/pinku/webanimator/MainActivity.java ]; then
            F=$(find . -name "MainActivity.java" -not -path "*/build/*" -not -path "./.git/*" | head -n1)
            if [ -n "$F" ]; then cp "$F" $A/java/com/pinku/webanimator/MainActivity.java; echo "Copied MainActivity.java from $F"; fi
          fi
          echo "=== final java file ==="
          ls -l $A/java/com/pinku/webanimator/ || true
          true

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Check APK contents
        run: |
          APK=github/workflows/app/build/outputs/apk/debug/app-debug.apk
          unzip -l $APK | grep "assets/animator.js" || { echo "ERROR: animator.js MISSING in assets"; exit 1; }
          unzip -p $APK classes.dex > /tmp/classes.dex
          if grep -a -q "com/pinku/webanimator/MainActivity" /tmp/classes.dex; then
            echo "ALL OK: MainActivity and animator.js are inside the APK"
          else
            echo "ERROR: MainActivity MISSING"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: WebAnimator-APK
          path: github/workflows/app/build/outputs/apk/debug/app-debug.apk

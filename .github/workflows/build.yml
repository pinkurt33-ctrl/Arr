name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Show files
        run: find . -path ./.git -prune -o -type f \( -name "*.java" -o -name "*.js" -o -name "*.gradle" -o -name "AndroidManifest.xml" \) -print
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Check APK contents
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "assets/animator.js"
          unzip -p app/build/outputs/apk/debug/app-debug.apk classes.dex > /tmp/c.dex
          grep -a -q "com/pinku/webanimator/MainActivity" /tmp/c.dex && echo "ALL OK"
      - uses: actions/upload-artifact@v4
        with:
          name: WebAnimator-APK
          path: app/build/outputs/apk/debug/app-debug.apk

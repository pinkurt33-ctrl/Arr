name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Place files
        run: |
          A=github/workflows/app/src/main
          mkdir -p $A/assets $A/java/com/pinku/webanimator
          test -f MainActivity.java || { echo "ERROR: root me MainActivity.java nahi hai"; exit 1; }
          cp MainActivity.java $A/java/com/pinku/webanimator/MainActivity.java
          if [ ! -f $A/assets/animator.js ]; then
            F=$(find . -name animator.js -not -path "*/build/*" -not -path "./.git/*" | head -n1)
            cp "$F" $A/assets/animator.js
          fi
          ls -l $A/java/com/pinku/webanimator $A/assets
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Check APK contents
        run: |
          APK=github/workflows/app/build/outputs/apk/debug/app-debug.apk
          unzip -l $APK | grep "assets/animator.js"
          unzip -p $APK classes.dex > /tmp/classes.dex
          grep -a -q "com/pinku/webanimator/MainActivity" /tmp/classes.dex && echo "ALL OK"
      - uses: actions/upload-artifact@v4
        with:
          name: WebAnimator-APK
          path: github/workflows/app/build/outputs/apk/debug/app-debug.apk

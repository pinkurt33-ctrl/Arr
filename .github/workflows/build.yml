name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Check APK contents
        run: |
          APK=github/workflows/app/build/outputs/apk/debug/app-debug.apk
          unzip -l $APK | grep "assets/animator.js" || { echo "ERROR: animator.js MISSING in assets"; exit 1; }
          unzip -p $APK classes.dex | strings | grep -q "com/pinku/webanimator/MainActivity" || { echo "ERROR: MainActivity MISSING"; exit 1; }
          echo "ALL OK: MainActivity and animator.js are inside the APK"
      - uses: actions/upload-artifact@v4
        with:
          name: WebAnimator-APK
          path: github/workflows/app/build/outputs/apk/debug/app-debug.apk
